[package]
name = "folio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Linux-first Markdown live-preview editor built with Rune"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ccb4823f55749dfa667891ef7f8427017e960056", default-features = false, features = ["accessibility", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "ccb4823f55749dfa667891ef7f8427017e960056", features = ["markdown"] }
pulldown-cmark = "0.13"
rustix = { version = "1", features = ["fs"] }
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
